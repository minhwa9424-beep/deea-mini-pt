<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DEEA MINI PT · 비밀번호 재설정</title><style>body{background:#f7faf8;color:#26483f;font:16px sans-serif;margin:0}main{max-width:440px;margin:50px auto;padding:24px}section{background:white;border:1px solid #cadbd0;border-radius:20px;padding:24px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #cadbd0;font:inherit}button{background:#367d68;color:white;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}a{color:#367d68}</style></head><body><main><section><p>DEEA YOGA · MINI PT</p><h1>비밀번호 재설정</h1><p id="status" role="status">인증 링크 확인 중입니다.</p><form id="form" hidden><label>새 비밀번호<input id="pw" type="password" autocomplete="new-password" minlength="8" required></label><label>새 비밀번호 확인<input id="again" type="password" autocomplete="new-password" minlength="8" required></label><button id="save">비밀번호 변경</button></form><a href="./">로그인 화면으로 돌아가기</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>window.DEEA_CONFIG={supabaseUrl:"https://eqdlcjtctlniygtadynw.supabase.co",supabaseAnonKey:"sb_publishable_TeRrtRWM_NpALtsAq0Vbkg_A8bugix7",smsEnabled:false};const status=document.getElementById('status'),form=document.getElementById('form');const client=window.supabase.createClient(DEEA_CONFIG.supabaseUrl,DEEA_CONFIG.supabaseAnonKey,{auth:{storageKey:'deea-mini-pt-recovery',persistSession:false,detectSessionInUrl:true,flowType:'implicit'}});let ready=false;client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){ready=true;form.hidden=false;status.textContent='새 비밀번호를 입력하세요. (8자 이상)';history.replaceState(null,'',location.pathname);}});client.auth.getSession().then(()=>{if(!ready)status.textContent='유효한 재설정 링크가 필요합니다. 관리자 화면에서 새 이메일을 요청해 주세요.';});form.addEventListener('submit',async e=>{e.preventDefault();if(!ready)return;const pw=document.getElementById('pw').value,again=document.getElementById('again').value,save=document.getElementById('save');if(pw!==again){status.textContent='비밀번호가 일치하지 않습니다.';return}save.disabled=true;try{const {error}=await client.auth.updateUser({password:pw});if(error)throw error;ready=false;form.reset();form.hidden=true;await client.auth.signOut({scope:'global'});status.textContent='비밀번호가 변경되었습니다. 로그인 화면으로 돌아가 새 비밀번호로 로그인하세요.';}catch(e){status.textContent='변경 실패: '+e.message;}finally{save.disabled=false}});</script></body></html>
